# Bluetooth Vendor Configuration for SM8550

# UART device port where Bluetooth controller is attached
UartPort = /dev/ttyHS0

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/

# Firmware patch file name
FwPatchFileName = nvm_tlv_tf_1.1.bin

# SoC type
SocType = cherokee

# SoC logging
SocLog = false

# Patch download delay
PatchDLDelayMs = 100

# UART baud rate
UartBaudRate = 3000000

# Enable/Disable flow control
FlowControl = true

# Enable/Disable SIBS
EnableSibs = false

# Enable/Disable low power mode
LpmEnable = true

# WBS support
WbsEnable = true

# SNS support 
SnsEnable = false

# Enable SLIMBUS
SlimBusEnable = false

# A2DP offload support
A2dpOffloadEnabled = true

# Dual A2DP support
DualA2dpEnabled = false

# AAC codec support
AACCodecEnabled = true

# aptX codec support
AptXCodecEnabled = true

# aptX HD codec support
AptXHDCodecEnabled = true

# LDAC codec support
LDACCodecEnabled = true

# BLE scan duty cycle
BLEScanDutyCycle = 50

# BLE scan interval
BLEScanInterval = 96

# BLE scan window
BLEScanWindow = 48

# BLE advertising interval min
BLEAdvIntervalMin = 81

# BLE advertising interval max
BLEAdvIntervalMax = 181

# BLE supervision timeout
BLESupervisionTimeout = 420

# BLE connection interval min
BLEConnIntervalMin = 8

# BLE connection interval max
BLEConnIntervalMax = 16

# BLE connection latency
BLEConnLatency = 0

# Enable/Disable BLE peripheral mode
BLEPeripheralMode = true

# BLE max connections
BLEMaxConnections = 7

# Enable TWS+ support
TWSPlusEnabled = true

# Enable gaming mode low latency
GamingModeLowLatencyEnabled = true

# Gaming mode audio latency target (ms)
GamingModeLatencyTarget = 40